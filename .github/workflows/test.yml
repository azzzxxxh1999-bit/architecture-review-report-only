name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile scripts (syntax)
        run: python -m py_compile scripts/scan.py scripts/query.py scripts/apply_audit.py scripts/render.py scripts/version.py scripts/dashboard.py

      - name: Unit + golden tests
        run: python -m unittest discover -s tests -v
